name: Build, verify and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codexpulse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/UsageRemaining.Widget/UsageRemaining.Widget.csproj
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a stable three-part version.' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build Debug
        run: dotnet build UsageRemaining.sln -c Debug -p:Platform=x64 -m:1
      - name: Build Release
        run: dotnet build UsageRemaining.sln -c Release -p:Platform=x64 -m:1 --no-restore
      - name: Run deterministic checks
        run: ./tests/UsageRemaining.Checks/bin/Release/net10.0-windows/UsageRemaining.Checks.exe
      - name: Run update UI safety checks with fake services
        run: ./tests/UsageRemaining.Checks/bin/Release/net10.0-windows/UsageRemaining.Checks.exe --update-ui
      - name: Run startup preference and header checks with fake services
        run: ./tests/UsageRemaining.Checks/bin/Release/net10.0-windows/UsageRemaining.Checks.exe --startup-ui
      - name: Run Google calendar UI checks with fake services
        run: ./tests/UsageRemaining.Checks/bin/Release/net10.0-windows/UsageRemaining.Checks.exe --google-ui
      - name: Run Google OAuth checks with fake services
        run: ./tests/UsageRemaining.Checks/bin/Release/net10.0-windows/UsageRemaining.Checks.exe --google-oauth
      - name: Verify single instance with concurrent processes
        run: ./tests/UsageRemaining.Checks/bin/Release/net10.0-windows/UsageRemaining.Checks.exe --single-instance
      - name: Install packaging tool
        run: dotnet tool install vpk --tool-path artifacts/tools --version 1.2.161
      - name: Verify pull request packaging without release registration
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: ./scripts/Build-Release.ps1
      - name: Package installer and update feed
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GOOGLE_DESKTOP_CLIENT_JSON: ${{ secrets.GOOGLE_DESKTOP_CLIENT_JSON }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_DESKTOP_CLIENT_JSON)) {
            throw 'Configure the GOOGLE_DESKTOP_CLIENT_JSON repository secret before publishing.'
          }
          $configuration = Join-Path $env:RUNNER_TEMP 'codexpulse-google-desktop-client.json'
          try {
            [IO.File]::WriteAllText($configuration, $env:GOOGLE_DESKTOP_CLIENT_JSON, (New-Object Text.UTF8Encoding($false)))
            ./scripts/Build-Release.ps1 -GoogleConfigurationPath $configuration -RequireGoogleConfiguration
          }
          finally {
            if (Test-Path -LiteralPath $configuration) { Remove-Item -LiteralPath $configuration -Force }
          }
      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CodexPulse-${{ steps.version.outputs.value }}-win-x64
          path: publish/${{ steps.version.outputs.value }}/releases/*
          if-no-files-found: error
      - name: Publish a new version to GitHub Releases
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --json tagName --limit 1000 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not list releases.' }
          if (@($releases | Where-Object tagName -eq "v$version").Count -gt 0) {
            Write-Output "v$version already exists; no release files are overwritten."
            exit 0
          }
          $directory = "publish/$version/releases"
          $package = "BTL.CodexPulse-$version-full.nupkg"
          $feed = Get-Content -Raw -Encoding utf8 "$directory/releases.win.json" | ConvertFrom-Json
          if (@($feed.Assets).Count -ne 1 -or $feed.Assets[0].FileName -ne $package -or $feed.Assets[0].Type -ne 'Full') {
            throw 'Expected a single full update package in the release feed.'
          }
          $hash = (Get-FileHash "$directory/$package" -Algorithm SHA256).Hash
          if ($hash -ne $feed.Assets[0].SHA256 -or (Get-Item "$directory/$package").Length -ne $feed.Assets[0].Size) {
            throw 'Update package does not match its release feed.'
          }
          $assets = @("$directory/BTL.CodexPulse-win-Setup.exe", "$directory/$package", "$directory/releases.win.json")
          $arguments = @('release', 'create', "v$version", '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:GITHUB_SHA, '--title', "Codex Pulse $version", '--draft')
          $notes = "release-notes/$version.md"
          if (Test-Path -LiteralPath $notes) { $arguments += @('--notes-file', $notes) }
          & gh @arguments @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
          gh release edit "v$version" --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
      - name: Keep only essential release assets
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $tag = "v$version"
          $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect release assets.' }
          $required = @('BTL.CodexPulse-win-Setup.exe', "BTL.CodexPulse-$version-full.nupkg", 'releases.win.json')
          foreach ($name in $required) {
            if ($name -notin $release.assets.name) { throw "Required release asset is missing: $name" }
          }
          foreach ($name in @('BTL.CodexPulse-win-Portable.zip', 'RELEASES', 'SHA256SUMS.txt')) {
            if ($name -in $release.assets.name) {
              gh release delete-asset $tag $name --repo $env:GITHUB_REPOSITORY --yes
              if ($LASTEXITCODE -ne 0) { throw "Could not remove optional release asset: $name" }
            }
          }
          $remaining = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify remaining assets.' }
          if (@($remaining.assets).Count -ne 3 -or @($remaining.assets.name | Where-Object { $_ -notin $required }).Count -ne 0) {
            throw 'The release must contain exactly three uploaded assets.'
          }
